# GitHub Actions CI/CD Pipeline
# Runs automatically on every push or pull request to the main branch
# Jobs: frontend (test + build), backend (install), docker (build image)

name: CI/CD Pipeline

on:
  push:
    branches: ["main"]         # Trigger on direct pushes to main
  pull_request:
    branches: ["main"]         # Trigger on PRs targeting main

jobs:

  # ── Job 1: Frontend ──────────────────────────────────────────────────────────
  # Installs dependencies, runs tests, builds React app, uploads build artifact
  frontend:
    name: Frontend - Install, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Checkout the repository code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'             # Cache node_modules to speed up future runs

      - name: Install dependencies
        run: npm install           # Install root package.json (React + build tools)

      - name: Run tests
        run: npm test -- --passWithNoTests --watchAll=false  # Run tests in CI mode

      - name: Build
        run: npm run build         # Compile React app to /build folder

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/             # Save the compiled React files for later jobs

  # ── Job 2: Backend ───────────────────────────────────────────────────────────
  # Installs backend dependencies to validate package.json is correct
  backend:
    name: Backend - Install & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package.json  # Cache based on server deps

      - name: Install dependencies
        run: npm install
        working-directory: server  # Run npm install inside the server/ folder

  # ── Job 3: Docker Build ──────────────────────────────────────────────────────
  # Builds the Docker image only after both frontend and backend jobs succeed
  # Only runs on the main branch (not on PRs)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]   # Wait for both jobs above to pass first
    if: github.ref == 'refs/heads/main'  # Skip on pull requests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .  # Tag image with commit SHA for traceability
