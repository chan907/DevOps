# Docker Compose file for the full DevOps stack
# Defines 3 services: jenkins (CI/CD), app (Node/React), mongo (database)
version: '3.8'

name: devops-app

services:

  # ── Jenkins CI/CD Server ────────────────────────────────────────────────────
  # Built from Dockerfile.jenkins (custom image with Node.js + Docker CLI)
  # Accessible at http://localhost:8081
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins   # Custom Jenkins image with Node + Docker
    container_name: jenkins
    user: root                          # Needs root to access Docker socket
    ports:
      - "8081:8080"                     # Jenkins web UI  → host:8081
      - "50000:50000"                   # Jenkins agent communication port
    volumes:
      - jenkins-data:/var/jenkins_home  # Persist Jenkins jobs, plugins, config
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Jenkins to run Docker commands on host
      # Mount local project folders so Jenkins can build them inside the container
      - D:\Rahul\construction-site-management-system:/home/rahul-construction
      - D:\Riya:/home/riya
      - D:\Rahul\oop-simulator:/home/rahul
      - D:\Chanakshi\oop-simulator:/home/chanakshi
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock  # Tell Docker CLI to use the mounted socket
    restart: unless-stopped

  # ── Application Server (Node.js + React) ────────────────────────────────────
  # Pre-built image: run `docker build -t devops-app .` before starting
  # Accessible at http://localhost:8002
  app:
    image: devops-app:latest            # Built by Dockerfile (multi-stage: React + Node)
    ports:
      - "8002:8000"                     # App server → host:8002
    environment:
      - PORT=8000                       # Express listens on this port inside container
      - DATABASE=mongodb://mongo:27017/ecommerce  # MongoDB connection string (uses service name)
      - JWT_SECRET=demo_jwt_secret      # Secret key for signing JWT tokens
      - BRAINTREE_MERCHANT_ID=demo_merchant_id    # Braintree sandbox credentials
      - BRAINTREE_PUBLIC_KEY=demo_public_key
      - BRAINTREE_PRIVATE_KEY=demo_private_key
    depends_on:
      - mongo                           # Wait for mongo to start before launching app
    restart: unless-stopped

  # ── MongoDB Database ─────────────────────────────────────────────────────────
  # No port exposed to host — only accessible by other containers on this network
  mongo:
    image: mongo:6                      # Official MongoDB 6 image
    volumes:
      - mongo-data:/data/db             # Persist database files across container restarts
    restart: unless-stopped

# Named volumes — managed by Docker, data survives container removal
volumes:
  jenkins-data:   # Stores Jenkins home directory (jobs, plugins, credentials)
  mongo-data:     # Stores MongoDB data files
